name: import-photos
on:
  workflow_dispatch:
  push:
    branches: [feat/herp-shop]
    paths:
      - ".github/workflows/import-photos.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/herp-shop
      - name: Download slot photos
        run: |
          mkdir -p assets/img
          curl -fsSL -k -o assets/img/hero.jpg http://www.harrisinwonderland.com/images/giant-day.JPG
          curl -fsSL -k -o assets/img/case-snakes.jpg http://www.harrisinwonderland.com/images/Ball1.jpg
          curl -fsSL -k -o assets/img/case-lizards.jpg http://www.harrisinwonderland.com/images/panther2.jpg
          curl -fsSL -k -o assets/img/case-amphibians.jpg http://www.harrisinwonderland.com/images/red-eye.JPG
          curl -fsSL -k -o assets/img/bdaysnake55.jpg http://www.harrisinwonderland.com/images/bdaysnake55.jpg
          ls -la assets/img
      - name: Commit photos
        run: |
          git config user.name "VoidcallerOC"
          git config user.email "voidcalleroc@gmail.com"
          git add assets/img/hero.jpg assets/img/case-snakes.jpg assets/img/case-lizards.jpg assets/img/case-amphibians.jpg assets/img/bdaysnake55.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add real herp photos from the old shop site"
          git push
